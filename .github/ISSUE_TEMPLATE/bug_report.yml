name: Bug report
description: Something broke, crashed, or behaved wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Two things speed up every bug report enormously:

        1. **Run `tidectl report` and attach the file it writes** (default `tidewm-report.txt`). It bundles the quick health check plus your OS, kernel, build, GPU, compositor state, services, and recent errors into one attachment — no copy-pasting logs by hand. If TideWM won't even start, the report still works: it collects the host side and your journal.
        2. **Run `tidectl doctor`** first and mention anything it flags — a broken PipeWire or a portal pointed at the wrong desktop is often the whole story.
  - type: markdown
    attributes:
      value: |
        The dropdowns below aren't bureaucracy either — backend and GPU genuinely change which code ran.
  - type: input
    id: version
    attributes:
      label: TideWM version
      description: "From the report's Summary line, or `tidectl --version`. A commit hash is even better."
      placeholder: "0.90.0 (commit 9e28e65, release)"
    validations:
      required: true
  - type: input
    id: report
    attributes:
      label: tidectl report attachment
      description: "Please run `tidectl report` and attach the file. If you can't (no shell access), say so — the dropdowns below still help."
      placeholder: "tidewm-report.txt"
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: Nested runs as a window inside another session; standalone owns a TTY. They share most code but not all of it.
      options:
        - Nested (winit) — a window inside another compositor
        - Standalone (udev/DRM) — its own TTY session
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      options:
        - AMD
        - Intel
        - Nvidia (proprietary driver)
        - Nvidia (nouveau)
        - Multiple / hybrid graphics
        - Virtual machine
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Best guess is fine.
      options:
        - Tiling / layout (BSP, master-stack, gaps, groups)
        - Floating / fullscreen / maximize / pseudo-tile
        - Workspaces / scratchpads / pinning
        - Keyboard input / keybinds / submaps
        - Pointer / touchpad / gestures / touch
        - Window rules / swallowing
        - Screenshots / screencasting
        - XWayland (X11 apps)
        - Config / hot-reload
        - IPC / tidectl
        - Rendering / visual artifacts
        - Session / lock screen / idle / DPMS
        - App compatibility (a specific client misbehaves)
        - Multi-monitor / outputs
        - Something else
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - Crash or full freeze
        - Feature doesn't work at all
        - Works, but behaves wrong
        - Cosmetic / minor annoyance
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If you can make it happen on demand, list the steps. "Happened once, no idea how" is still worth filing — say that instead.
      placeholder: |
        1. Launch nested with default config
        2. Open two kitty windows
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The report attachment already contains your recent journal errors. Add anything extra here: run with `RUST_LOG=TideWM=debug` (capital TideWM — lowercase silently matches nothing) and paste what's relevant. For a crash, the panic message and backtrace (`RUST_BACKTRACE=1`) are the single most useful thing you can include."
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant part of your `config.wave`, if the bug involves config at all. "Default config" is a complete answer.
      render: text
  - type: input
    id: distro
    attributes:
      label: Distro / environment
      placeholder: "Arch, kernel 6.15, host compositor KDE Plasma (if nested)"
