name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwayland-dev libudev-dev libinput-dev \
            libxkbcommon-dev libgbm-dev libegl1-mesa-dev libdrm-dev libseat-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      # Host-side diagnostics must work without a running compositor (that's
      # the whole point -- it's how someone whose TideWM won't start files a
      # bug). Exit 0 means no warnings/failures found; in CI the compositor
      # check skips cleanly and the remaining host checks run for real.
      - name: tidectl doctor smoke test
        run: |
          cargo run --locked --bin tidectl -- doctor --json | tee /tmp/doctor.json | jq .
          jq -e '.verdict == "ok" or .verdict == "warn"' /tmp/doctor.json
