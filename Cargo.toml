[package]
name = "tidewm"
version = "0.90.60"
edition = "2021"
# Verified floor: wayland-protocols 0.32.13 requires 1.86 (1.85 fails to
# compile it). The optional `screencast`/`accessibility` features need
# newer still (zbus 5.18 requires 1.87) -- documented in README, not
# reflected here since both are off by default (see AGENT.md).
rust-version = "1.86"

[[bin]]
name = "TideWM"
path = "src/main.rs"

[dependencies]
bitflags = "2.2.1"
cgmath = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
calloop = { version = "0.14", features = ["signals"] }
fontdue = "0.9.3"
png = "0.18"
regex = "1"
xcursor = "0.3"
wayland-protocols-wlr = "0.3.12"
# Screencasting only (org.gnome.Mutter.ScreenCast over DBus + PipeWire
# monitor/window streaming, see AGENT.md's "Screencasting" section) --
# optional and default-off to keep these native/runtime dependencies out of
# a minimal build. Versions match niri's known-good pins.
zbus = { version = "5.13.2", optional = true }
async-io = { version = "2.6.0", optional = true }
# v0_3_34: unlocks `Stream::trigger_process`/`is_driving`, required for a
# `StreamFlags::DRIVER` stream to ever produce a frame (see
# pipewire_thread.rs's `run()`) -- a compile-time API-surface gate only,
# not a runtime requirement beyond libpipewire >= 0.3.34 (2021), which
# every current distro ships.
pipewire = { version = "0.10.0", optional = true, features = ["v0_3_34"] }
blocking = { version = "1.6", optional = true }
# Accessibility only (`org.freedesktop.a11y.KeyboardMonitor`): its
# NameOwnerChanged disconnect-watch stream needs `StreamExt`, matching
# niri's own dependency on this crate for the identical purpose.
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# Accessible tree/announcements for TideWM's own compositor UI. The Unix
# adapter exposes the tree through AT-SPI and keeps its async work off the
# single-threaded compositor loop.
accesskit = { version = "0.24.1", optional = true }
accesskit_unix = { version = "0.22.0", optional = true }
# Keep Smithay and smithay-drm-extras on Niri's exact known-good revision.
# Crates.io 0.7.0 does not reset wlr-layer-shell state on null-buffer
# unmap; this revision includes upstream commit 0565e70a, which performs
# the protocol-required reset in Smithay's pre-commit hook.
#
# default-features off: drm-extras' "display-info" feature needs libdisplay-info
# < 0.3.0 via pkg-config, older than what current distros ship. We only need
# DrmScanner (unconditional), not the EDID make/model/serial lookup.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef", default-features = false }
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
default-features = false
features = [
    "backend_winit",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_egl",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
]

[features]
# Off by default: pulls in the project's first async runtime (zbus) and
# PipeWire threads talking back to the single-threaded compositor over
# calloop channels). See AGENT.md's "Screencasting" section.
screencast = [
    "dep:zbus",
    "dep:async-io",
    "dep:pipewire",
    "dep:blocking",
    "dep:futures-util",
]
# Off by default, same reasoning as `screencast` (pulls in zbus/async-io) --
# deliberately its own flag, not bundled with `screencast`, so enabling
# accessibility doesn't also drag in PipeWire/`libclang`. Implements
# `org.freedesktop.a11y.KeyboardMonitor` (see AGENT.md's "Accessibility"
# section) so a screen reader (Orca) can grab/watch keys system-wide --
# Wayland's per-client input isolation otherwise makes that impossible.
accessibility = [
    "dep:zbus",
    "dep:async-io",
    "dep:futures-util",
    "dep:accesskit",
    "dep:accesskit_unix",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
