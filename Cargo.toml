[package]
name = "tidewm"
version = "0.1.0"
edition = "2021"
# Verified floor: wayland-protocols 0.32.13 requires 1.86 (1.85 fails to
# compile it). The optional `screencast` feature needs newer still (zbus
# 5.18 requires 1.87) -- documented in README, not reflected here since
# the feature is off by default and not yet functional (see AGENT.md).
rust-version = "1.86"

[[bin]]
name = "TideWM"
path = "src/main.rs"

[dependencies]
bitflags = "2.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
fontdue = "0.9.3"
xcursor = "0.3"
wayland-protocols-wlr = "0.3.12"
# Screencasting only (org.gnome.Mutter.ScreenCast over DBus + PipeWire
# streaming, see AGENT.md's "Screencasting" section) -- optional, default
# off, so the build stays binary-identical for everyone until Phase E's
# screencast half actually lands. Versions match Niri's own pins, the
# reference this design follows.
zbus = { version = "5.13.2", optional = true }
async-io = { version = "2.6.0", optional = true }
pipewire = { version = "0.10.0", optional = true }
# Keep Smithay and smithay-drm-extras on Niri's exact known-good revision.
# Crates.io 0.7.0 does not reset wlr-layer-shell state on null-buffer
# unmap; this revision includes upstream commit 0565e70a, which performs
# the protocol-required reset in Smithay's pre-commit hook.
#
# default-features off: drm-extras' "display-info" feature needs libdisplay-info
# < 0.3.0 via pkg-config, older than what current distros ship. We only need
# DrmScanner (unconditional), not the EDID make/model/serial lookup.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef", default-features = false }

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
default-features = false
features = [
    "backend_winit",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_egl",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
]

[features]
# Off by default: pulls in the project's first async runtime (zbus) and
# first multi-threaded code (a PipeWire thread talking back to the
# single-threaded compositor over calloop channels). See AGENT.md's
# "Screencasting" section before extending src/screencast/ -- the module
# is a structural skeleton only, no DBus interface or PipeWire stream is
# actually wired up yet.
screencast = ["dep:zbus", "dep:async-io", "dep:pipewire"]

[profile.release]
lto = true
codegen-units = 1
strip = true
